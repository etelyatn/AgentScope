[package]
name = "agentscope"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
same-file = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
