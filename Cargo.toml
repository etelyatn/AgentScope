[package]
name = "agentscope"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
same-file = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
thiserror = "2.0.21"
toml = "1.1.8"
unicode-width = "0.2.3"

[dev-dependencies]
agentscope = { path = ".", features = ["perf-counters"] }
tempfile = "3.27.0"

[features]
# Thread-local work counters for tests/perf_budget.rs; compiled out otherwise.
perf-counters = []
